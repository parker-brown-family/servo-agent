[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servo-agent"
version = "0.3.0"
description = "An agent-controllable browser over the Servo engine's built-in WebDriver."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "servo-agent contributors" }]
keywords = ["servo", "webdriver", "browser", "agent", "llm", "mcp", "scraping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
# Lower bounds are the oldest versions the test suite has passed against.
dependencies = [
    "requests>=2.31",
    # 2.2.0 drops headings and links from some pages; 2.3.0 restored them.
    "trafilatura>=2.1,!=2.2.0",
    "markdownify>=0.11.6",
    "beautifulsoup4>=4.12",
    # The server is written against mcp 2's MCPServer (1.x called it FastMCP and
    # took host and port in the constructor). 2.3 is the oldest 2.x tested.
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
servo-agent = "servo_agent.cli:main"

[project.urls]
Homepage = "https://github.com/parker-brown-family/servo-agent"
Repository = "https://github.com/parker-brown-family/servo-agent"
Documentation = "https://github.com/parker-brown-family/servo-agent/tree/main/docs"
Changelog = "https://github.com/parker-brown-family/servo-agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/parker-brown-family/servo-agent/issues"
Demo = "https://servo-agent.brownfamilysports.com"

[tool.hatch.build.targets.sdist]
# Hatchling reads the project's .gitignore but not the global one, so a local
# build would otherwise pick up untracked tool state such as .claude/. The
# product page and design notes are not part of the package.
exclude = ["/.claude", "/.github", "/web", "/web/assets/*.png", "/design", "/dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/servo_agent"]
# ship the PEP 561 typed marker so downstreams pick up our type hints
force-include = { "src/servo_agent/py.typed" = "servo_agent/py.typed" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a built servoshell binary (skipped if absent)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
