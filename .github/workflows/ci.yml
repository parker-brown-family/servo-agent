name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, against the newest releases our version ranges allow. Pushes and
  # PRs test the committed uv.lock, so an upstream release that breaks us
  # (mcp 2, trafilatura 2.2) fails here instead of turning main red unnoticed.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync deps (the lock; the newest allowed releases on the weekly run)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            uv sync --extra dev --upgrade
          else
            uv sync --extra dev --locked
          fi

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Tests (unit; integration auto-skips without a servoshell binary)
        run: uv run --no-sync pytest -v

  # Full integration tests need a built servoshell. Servo's own build is heavy,
  # so we gate it behind a manual dispatch / self-hosted runner rather than
  # building the engine on every push.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, servo]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev --locked
      - name: Integration tests
        env:
          SERVOSHELL: ${{ env.SERVOSHELL }}
        run: uv run --no-sync pytest -v -m integration
